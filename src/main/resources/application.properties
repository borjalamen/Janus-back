# =================================================================
# CONFIGURACIÓN DE CONEXIÓN A MONGO DB ATLAS (CLÚSTER ÚNICO)
# =================================================================
 
# 1. URL de Conexión (Pega aquí la URL que obtuviste de Atlas)
# Nota: La base de datos por defecto será 'janusdb' si no especificamos nada.
spring.data.mongodb.uri=mongodb+srv://DevOps:DevOps2025@janushub.c3oujt9.mongodb.net/
# 2. Configuración Adicional (Recomendada)
# Especifica la Base de Datos por defecto (Janus Hub)
spring.data.mongodb.database=janusdb
 
# Habilita la creación automática de índices
# spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.auto-index-creation=false
 
# Puerto de Tomcat (si lo quieres en el 8080)
server.port=8080
 
# OpenAI settings (lee la clave desde la variable de entorno OPENAI_API_KEY si está definida)
openai.api.key=${OPENAI_API_KEY:}
openai.model=gpt-4o-mini
 
# Límits d'upload
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
 
# Jackson: serialize dates as ISO strings, not timestamps
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
# =================================================================
# CONFIGURACIÓN DE CONEXIÓN A MONGO DB ATLAS (CLÚSTER ÚNICO)
# =================================================================
 
# 1. URL de Conexión (Pega aquí la URL que obtuviste de Atlas)
# Nota: La base de datos por defecto será 'janusdb' si no especificamos nada.
spring.data.mongodb.uri=mongodb://DevOps:DevOps2025@172.19.208.104:27017
# 2. Configuración Adicional (Recomendada)
# Especifica la Base de Datos por defecto (Janus Hub)
spring.data.mongodb.database=janusdb
 
# Habilita la creación automática de índices
# spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.auto-index-creation=false
 
# Puerto de Tomcat (si lo quieres en el 8080)
server.port=8080
 
# =================================================================
# GROQ AI (compatible con API OpenAI, tier gratuito ~14.400 req/día)
# Obtén tu clave gratuita en: https://console.groq.com/keys
# =================================================================
# Clave API — pon aquí tu clave o usa la variable de entorno GROQ_API_KEY
groq.api.key=${GROQ_API_KEY:}
# Modelo (opciones gratuitas): llama-3.1-8b-instant | llama-3.3-70b-versatile | gemma2-9b-it
groq.model=llama-3.1-8b-instant
# URL de la API de Groq (formato OpenAI-compatible)
groq.api.url=https://api.groq.com/openai/v1/chat/completions
# Máximo de tokens por respuesta (1024 es más que suficiente para el chat)
groq.max.tokens=1024
# Ruta al Markdown de la guía de usuario (relativa a resources/ o ruta absoluta)
app.docs.md.path=JANUSHUB_GUIA_USUARIO.md

# =================================================================
# CONFIGURACIÓN DE EMAIL (NOTIFICACIONES)
# =================================================================
# Puedes configurarlo por variables de entorno para no hardcodear credenciales.
# Si SPRING_MAIL_HOST está vacío, el sistema no enviará correos y solo registrará logs.
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.from=${APP_MAIL_FROM:a9dec2001@smtp-brevo.com}
app.base-url=${APP_BASE_URL:http://localhost:4200}

spring.mail.host=${SPRING_MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:a9dec2001@smtp-brevo.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:bsk09DlkyyhP00D}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_SMTP_WRITE_TIMEOUT:5000}
 
# Ruta base para uploads (avatars, CVs, etc.)
# Por defecto usa la carpeta 'uploads' relativa al directorio de ejecución
upload.root=${UPLOAD_ROOT:uploads}

# Límits d'upload
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Encoding UTF-8 para peticiones (incluye campos multipart)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force-request=true
server.servlet.encoding.enabled=true
 
# Jackson: serialize dates as ISO strings, not timestamps
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false


server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# =================================================================
# JWT
